name: MT5 Bridge CI

on:
  push:
    branches: [main, "development/**"]
    paths:
      - "services/mt5-bridge/**"
      - ".github/workflows/mt5-bridge-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/mt5-bridge/**"
      - ".github/workflows/mt5-bridge-ci.yml"

jobs:
  windows-python-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bridge dependencies
        run: python -m pip install -r services/mt5-bridge/requirements.txt
      - name: Compile bridge
        run: python -m compileall -q services/mt5-bridge
